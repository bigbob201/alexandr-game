<canvas id="gameCanvas"></canvas>

<script>
    const cvs = document.getElementById("gameCanvas");
    const ctx = cvs.getContext("2d");

    // Определяем устройство и подстраиваем формат (ПК -> 16:9, Телефон -> 9:16)
    let isMobile = window.innerWidth < window.innerHeight;

    function setupResolution() {
        isMobile = window.innerWidth < window.innerHeight;
        if (isMobile) {
            cvs.width = 720;   // Вертикальный формат 9:16 для мобилок
            cvs.height = 1280;
        } else {
            cvs.width = 1280;  // Горизонтальный формат 16:9 для ПК
            cvs.height = 720;
        }
    }
    setupResolution();
    window.addEventListener('resize', setupResolution);

    const birdImg = new Image();
    birdImg.src = "image_3.png";

    const pipeImg = new Image();
    pipeImg.src = "image_4.png";

    const bgImg = new Image();
    bgImg.src = "wedding.png";

    let frames = 0;
    
    const state = {
        current: 0,
        getReady: 0,
        game: 1,
        over: 2
    };

    function flap() {
        switch(state.current) {
            case state.getReady:
                state.current = state.game;
                bird.flap();
                break;
            case state.game:
                bird.flap();
                break;
            case state.over:
                pipes.reset();
                bird.speed = 0;
                bird.y = cvs.height / 2;
                score.reset();
                state.current = state.getReady;
                break;
        }
    }

    cvs.addEventListener("click", flap);
    cvs.addEventListener("touchstart", function(e) {
        e.preventDefault();
        flap();
    }, { passive: false });

    document.addEventListener("keydown", function(e) {
        if(e.code === "Space" || e.code === "ArrowUp") {
            flap();
        }
    });

    const bird = {
        x: 0,
        y: 0,
        w: 0,
        h: 0,
        gravity: 0.22,
        jump: -7.2,
        speed: 0,

        initDimensions: function() {
            if (isMobile) {
                this.x = 150;
                this.w = 90;
                this.h = 90;
                this.gravity = 0.32; // Чуть бодрее на телефоне
                this.jump = -8.5;
            } else {
                this.x = 250;
                this.w = 75;
                this.h = 75;
                this.gravity = 0.22; // Плавнее на ПК
                this.jump = -7.2;
            }
        },

        draw: function() {
            ctx.save();
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.speed / 12)));
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(angle);

            if(birdImg.complete && birdImg.naturalHeight !== 0) {
                ctx.drawImage(birdImg, -this.w/2, -this.h/2, this.w, this.h);
            } else {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            }
            ctx.restore();
        },

        update: function() {
            if(state.current === state.getReady) {
                this.y = cvs.height / 2 + Math.sin(frames / 12) * 12;
            } else {
                this.speed += this.gravity;
                this.y += this.speed;

                if(this.y + this.h >= cvs.height) {
                    this.y = cvs.height - this.h;
                    state.current = state.over;
                }
                if(this.y <= 0) {
                    this.y = 0;
                    this.speed = 0;
                }
            }
        },

        flap: function() {
            this.speed = this.jump;
        }
    };

    // Инициализируем размеры птицы при старте
    bird.initDimensions();

    const pipes = {
        position: [],
        
        draw: function() {
            let pW = isMobile ? 130 : 110;
            let gapSize = isMobile ? 320 : 260;

            for(let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                
                if(pipeImg.complete && pipeImg.naturalHeight !== 0) {
                    ctx.drawImage(pipeImg, p.x, 0, pW, p.top);
                    ctx.drawImage(pipeImg, p.x, p.top + gapSize, pW, cvs.height - (p.top + gapSize));
                } else {
                    ctx.fillStyle = "#e74c3c";
                    ctx.fillRect(p.x, 0, pW, p.top);
                    ctx.fillRect(p.x, p.top + gapSize, pW, cvs.height - (p.top + gapSize));
                }
            }
        },

        update: function() {
            if(state.current !== state.game) return;

            let pW = isMobile ? 130 : 110;
            let gapSize = isMobile ? 320 : 260;
            let speedDx = isMobile ? 4.2 : 2.5; // На мобилке скорость выше, чтобы не было скучно
            let spawnInterval = isMobile ? 100 : 170;

            if(frames % spawnInterval === 0) {
                let minTop = 80;
                let maxTop = cvs.height - gapSize - 100;
                let randomTop = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

                this.position.push({
                    x: cvs.width,
                    top: randomTop
                });
            }

            for(let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                p.x -= speedDx;
                
                // Мягкие хитбоксы
                let hb = isMobile ? 22 : 18;
                if(bird.x + bird.w - hb > p.x && bird.x + hb < p.x + pW && 
                   (bird.y + hb < p.top || bird.y + bird.h - hb > p.top + gapSize)) {
                    state.current = state.over;
                }

                if(p.x + pW <= 0) {
                    this.position.shift();
                    score.value += 1;
                    score.best = Math.max(score.value, score.best);
                    i--;
                }
            }
        },
        
        reset: function() {
            this.position = [];
        }
    };

    const score = {
        best: 0,
        value: 0,
        
        draw: function() {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 6;

            let fSizeReady = isMobile ? "50px" : "40px";
            let fSizeGame = isMobile ? "80px" : "60px";
            let fSizeOver = isMobile ? "65px" : "55px";

            if(state.current === state.getReady) {
                ctx.font = `bold ${fSizeReady} sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText("ТАПНИ, ЧТОБЫ НАЧАТЬ", cvs.width/2, cvs.height/2 - 60);
                ctx.strokeText("ТАПНИ, ЧТОБЫ НАЧАТЬ", cvs.width/2, cvs.height/2 - 60);
            } else if(state.current === state.game) {
                ctx.font =upResolution() {
        isMobil
                ctx.textAlign = "center";
                ctx.fillText(this.value, cvs.width/2, isMobile ? 120 : 80);
                ctx.strokeText(this.value, cvs.width/2, isMobile ? 120 : 80);
            } else if(state.current === state.over) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, cvs.width, cvs.height);
                
                ctx.fillStyle = "#FFF";
                ctx.font =мат 9:16 для мобилок
           
                ctx.textAlign = "center";
                ctx.fillText("ИГРА ОКОНЧЕНА", cvs.width/2, cvs.height/2 - 80);
                ctx.strokeText("ИГРА ОКОНЧЕНА", cvs.width/2, cvs.height/2 - 80);
                
                ctx.font =nnerWidth < window.innerHeight;

    function set
                ctx.fillText("Счет: " + this.value, cvs.width/2, cvs.height/2);
                ctx.fillText("Лучший: " + this.best, cvs.width/2, cvs.height/2 + 60);
                
                ctx.font =-> 9:16)
    let isMobile = window.innerWidth < w
                ctx.fillStyle = "#f1c40f";
                ctx.fillText("Тапни для рестарта", cvs.width/2, cvs.height/2 + 140);
            }
        },
        
        reset: function() {
            this.value = 0;
        }
    };

    function loop() {// Если устройство повернули во время игры, обновляем стартовые координаты птицы
        if ((isMobile && cvs.width === 1280) || (!isMobile && cvs.width === 720)) {
            setupResolution();
            bird.initDimensions();
        }

        if(bgImg.complete && bgImg.naturalHeight !== 0) {
            ctx.drawImage(bgImg, 0, 0, cvs.width, cvs.height);
            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.fillRect(0, 0, cvs.width, cvs.height);
        } else {
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, cvs.width, cvs.height);
        }

        bird.update();
        pipes.update();
        
        pipes.draw();
        bird.draw();
        score.draw();

        frames++;
        requestAnimationFrame(loop);
    }

    loop();
</script>
